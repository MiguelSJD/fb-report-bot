name: "CI"

on:
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  ruff-annotations:
    name: "code-quality"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Changed Python Files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **.py
          matrix: false

      - name: Set up Python
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run Ruff on Changed Files
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: astral-sh/ruff-action@v3
        with:
          args: "check --output-format=github ${{ steps.changed-files.outputs.all_changed_files }}"
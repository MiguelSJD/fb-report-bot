name: "CI"

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - labeled

jobs:
  status-check-pr:
    name: pr-checks
    runs-on: ubuntu-latest
    if: |
      github.event.action != 'labeled' || 
      github.event.label.name == 'ci:pr-checks'
    permissions:
      pull-requests: write
    steps:
      - name: Validate PR Title and Description
        uses: actions/github-script@v9
        with:
          script: |
            const botCommentIdentifier = '<!-- pr-status-check-comment -->';
            
            // 1. CLEANUP FIRST: Always delete previous bot comments before anything else
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const workflowComments = comments.filter(comment => 
              comment.user.login === 'github-actions[bot]' &&
              comment.body && 
              comment.body.includes(botCommentIdentifier)
            );

            for (const comment of workflowComments) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: comment.id,
              });
            }

            // 2. BYPASS DEPENDABOT (Use .includes in case it's 'dependabot' or 'dependabot[bot]')
            if (context.payload.pull_request.user.login.includes('dependabot')) {
              core.notice("Skipping PR validation for Dependabot.");
              return; 
            }

            // 3. VALIDATION LOGIC
            const prTitle = context.payload.pull_request.title;
            const prBody = context.payload.pull_request.body || '';
            
            const titleRegex = /^(feat|refactor|fix|remove|build)\([a-zA-Z0-9_\-.]+\):\s+.+$/;
            const requiredSections = ['## Summary', '## Key Changes', '## How to Test'];
            
            const errors = [];

            if (!titleRegex.test(prTitle)) {
              errors.push(`- **Invalid Title**: "${prTitle}". Must follow \`type(scope): description\` (Allowed: \`feat\`, \`refactor\`, \`fix\`, \`remove\`, \`build\`).`);
            }

            const missingSections = requiredSections.filter(section => !prBody.includes(section));
            if (missingSections.length > 0) {
              errors.push(`- **Missing Description Sections**: ${missingSections.map(s => '\`' + s + '\`').join(', ')}.`);
            }

            if (errors.length > 0) {
              const commentBody = `${botCommentIdentifier}\n### ❌ PR Validation Errors\n\nPlease fix the following issues to pass CI:\n\n${errors.join('\n')}`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: commentBody,
              });

              core.setFailed("PR validation failed. Please review the errors in the comment.");
            }